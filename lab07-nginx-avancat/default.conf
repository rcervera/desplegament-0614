# default.conf - Laboratori 7: Nginx avançat
# Bloc 80 (HTTP): pàgines d'error, memòria cau, gzip, autoindex, autenticació i límit de pujades.
# Bloc 443 (HTTPS): mateix contingut xifrat amb el certificat de ssl/ (el generes tu, apartat 3).

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript;

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location ~* \.(css|js|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location /error500 {
        return 500;
    }

    location /fitxers/ {
        autoindex on;
    }

    location /privat {
        auth_basic "Zona restringida";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    location /pujar {
        limit_except POST {
            deny all;
        }
        client_max_body_size 1m;
        return 200 "Pujada acceptada\n";
    }
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
