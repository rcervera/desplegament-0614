# default.conf - Laboratori 5: rutes de prova per practicar el protocol HTTP
server {
    listen 80;
    absolute_redirect off;   # evita que es perdi el port extern de Docker a la capçalera Location

    # Fitxers estàtics: index.html, perfil.html, formulari.html i css/
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # 301: redirecció permanent
    location /redirigeix {
        return 301 /index.html;
    }

    # 403: accés prohibit
    location /prohibit {
        deny all;
    }

    # 500: error del servidor forçat
    location /trencat {
        return 500;
    }

    # Només accepta POST (qualsevol altre mètode: 405 Method Not Allowed)
    location /api/echo {
        if ($request_method != POST) {
            return 405;
        }
        add_header Content-Type application/json always;
        return 200 '{"missatge": "Peticio rebuda correctament"}';
    }

    # Només accepta DELETE (qualsevol altre mètode: 405 Method Not Allowed)
    location /api/recurs {
        if ($request_method != DELETE) {
            return 405;
        }
        add_header Content-Type application/json always;
        return 200 '{"missatge": "Recurs eliminat correctament"}';
    }

    # Formulari GET: Nginx llegeix els paràmetres de la URL ($arg_...)
    location /formulari-resultat {
        default_type text/html;
        return 200 '<!doctype html>
<html lang="ca">
<head><meta charset="utf-8"><title>Dades rebudes</title>
<link rel="stylesheet" href="/css/estils.css"></head>
<body class="estreta">
  <h1>Dades rebudes</h1>
  <div class="card">
    <table>
      <tr><td>Nom</td><td>$arg_nom</td></tr>
      <tr><td>Email</td><td>$arg_email</td></tr>
      <tr><td>Missatge</td><td>$arg_missatge</td></tr>
    </table>
    <a href="/formulari.html">← Torna al formulari</a>
  </div>
</body>
</html>';
    }

    # Formulari POST: només accepta POST; Nginx no pot llegir el cos de la petició, només confirma
    location = /formulari-post-info {
        if ($request_method != POST) {
            return 405;
        }
        default_type text/html;
        return 200 '<!doctype html>
<html lang="ca">
<head><meta charset="utf-8"><title>Formulari processat</title>
<link rel="stylesheet" href="/css/estils.css"></head>
<body class="estreta centrat">
  <h1>Formulari processat</h1>
  <div class="card">
    <p>La pàgina ha estat processada.</p>
    <p>De moment no es poden obtenir les variables enviades dins el cos de la petició HTTP.</p>
    <a href="/formulari.html">Torna al formulari</a>
  </div>
</body>
</html>';
    }
}
