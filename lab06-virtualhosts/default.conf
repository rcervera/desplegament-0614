# default.conf - Laboratori 6: dos hosts virtuals en un sol servidor Nginx
# Nginx tria el bloc server segons la capçalera Host de la petició.
# Cada bloc respon a dos noms: el .local (cal afegir-lo al fitxer hosts) i el
# .localhost (els navegadors el tradueixen sols a 127.0.0.1, sense tocar res).

# Lloc A: respon a Host: web-a.local o web-a.localhost
server {
    listen 80;
    server_name web-a.local web-a.localhost;

    root /usr/share/nginx/html/web-a;
    index index.html;
    access_log /var/log/nginx/web-a.access.log;
}

# Lloc B: respon a Host: web-b.local o web-b.localhost
server {
    listen 80;
    server_name web-b.local web-b.localhost;

    root /usr/share/nginx/html/web-b;
    index index.html;
    access_log /var/log/nginx/web-b.access.log;
}
